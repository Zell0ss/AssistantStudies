# Sebastian 2.0 Configuration Template
# Copy to config.yaml and fill in your credentials

# Telegram Bot
telegram_apikey: "your_telegram_bot_token_here"

# Anthropic API (Claude Haiku)
anthropic_apikey: "your_anthropic_api_key_here"

# Authorization (Telegram user IDs and usernames)
authorized_ids:
  - 123456789  # Replace with your Telegram user ID
authorized_users:
  - "username"  # Replace with your Telegram username

# El cuaderno (Sprint 4): a quién le llegan sus mensajes <telegram>. Explícito
# a propósito — NO se infiere de authorized_ids[0] (bug real: con más de un
# authorized_id, el índice 0 no tiene por qué ser el dueño del cuaderno).
cuaderno_chat_id: 123456789  # Replace with your Telegram user ID

# MariaDB
mariadb:
  host: "localhost"
  port: 3306
  database: "sebastian_db"
  user: "sebastian_user"
  password: "your_db_password_here"

# Logging
logfolder: "/data/AssistantStudies/sebastian2/logs"

# Sprites
sprites_path: "sprites/images"
sprite_mapping: "sprites/mapping.yaml"

# Obsidian vault (consult_docs, tasks_create validation)
vault_docs_path: "/path/to/vault/30-projects"

# YouTube transcript tool: directorio de trabajo para la tríada cruda (.vtt/.txt/.url)
youtube_workdir: "/data/ytb-video-extracts"
