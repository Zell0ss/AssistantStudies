# Golden regression cases for the Orchestrator's agentic loop.
#
# mode:
#   exact     - `expected` is a list[str]; the recorded tool-call sequence must equal it exactly (order matters).
#   multiset  - `expected` is a list[str]; same tools, any order (duplicates matter, order doesn't).
#   any_of    - `expected` is a list of list[str] alternatives; the recorded sequence must equal exactly one of them.
#   none      - no tools expected at all (also fails if request_clarification is called).
#
# Fixtures assumed present (seeded by tests/golden/conftest.py, user_id = golden_test_user):
#   - notes id 1017 and 1018
#   - inventory item "Actimel" (qty 2)
#   - calendar event "teatro" dated tomorrow, with one QR ticket attached
#   - project_tasks (NOT user-scoped, shared with glasspannel): one open task in
#     project "saxhero", plus task id 9001 (also "saxhero") for golden #19 to complete
#   - sebastian_memory_test (Qdrant, isolated collection): 3 seeded memories including
#     "Mi cuñado Paco es alérgico a los frutos secos" (golden #21 must find it)
#
# NOTE on golden #8/#9 vs the original ADR table: calendar_get_tickets requires event_id
# (its own tool description says "usa calendar_search_events primero") so the real expected
# sequence chains both tools, not just the tickets tool alone. See session notes.

- id: 1
  phrase: "Guárdame esta nota / Gotas mama / HYABAK a demanada una en cada ojo (fijas 12-16-20-24 horas) / Pequeñas 9:00 y 21:00 una en cada ojo AZARGA / Monodosis una gota sola ojo derecho de Lumigan a las 23:00 / Separar el lexatin al menos 1h de la de dormir"
  mode: exact
  expected: [notes_create]
  validates: "Nota multilínea con contenido médico intacto, sin resumir (revisar el input capturado en el informe, no solo la tool)"

- id: 2
  phrase: "Dime qué notas tengo"
  mode: exact
  expected: [notes_search]
  validates: "Listado simple. PASS con cualquier query — notes_search es la única tool disponible para esta intención (gap de producto anotado aparte, no se toca en esta sesión)"

- id: 3
  phrase: "borra las notas 1017 y la 1018"
  mode: multiset
  expected: [notes_delete, notes_delete]
  validates: "Encadenado: dos llamadas de un mensaje"

- id: 4
  phrase: "Qué tiempo va a hacer hoy en Madrid"
  mode: exact
  expected: [weather_get]
  validates: "Caso base"

- id: 5
  phrase: "Mírame que tiempo hace hoy en Madrid. Si puedes dame a que hora sale el.sol"
  mode: exact
  expected: [weather_get]
  validates: "Petición compuesta + errata real (\"el.sol\"). El sunrise ya viene en la respuesta de weather_get — dos llamadas sería FAIL por redundancia"

- id: 6
  phrase: "que tiempo va a hacer este fin de semana?"
  mode: exact
  expected: [weather_forecast]
  validates: "Rango de fechas relativo (requiere datetime en prompt)"

- id: 7
  phrase: "qué citas tengo para hoy y ya está"
  mode: exact
  expected: [calendar_list_events]
  validates: "Contención: \"y ya está\" prohíbe encadenar de más (p.ej. no debe seguir con calendar_get_tickets por cada evento)"

- id: 8
  phrase: "que tickets tengo para el teatro mañana?"
  mode: exact
  expected: [calendar_search_events, calendar_get_tickets]
  validates: "Filtro evento+fecha relativa. Encadenado obligatorio: calendar_get_tickets requiere event_id, solo se obtiene buscando primero"

- id: 9
  phrase: "lee mi cita de teatro de mañana"
  mode: any_of
  expected:
    - [calendar_search_events]
    - [calendar_search_events, calendar_get_tickets]
  validates: "Ambigua a propósito: lectura del evento vs lectura del ticket. Ambas aceptadas, se registra cuál elige"

- id: 10
  phrase: "Elimina de inventario actimeles"
  mode: exact
  expected: [inventory_remove]
  validates: "Fuzzy match \"actimeles\" → \"Actimel\" (el match aproximado es responsabilidad del modelo/tool, no de esta golden)"

- id: 11
  phrase: "Actualiza Actimel a 6 unidades"
  mode: exact
  expected: [inventory_set_quantity]
  validates: "Update con cantidad ABSOLUTA. Si el modelo llama a inventory_update_quantity (delta) es FAIL legítimo — imán de confusión conocido entre las dos tools de cantidad"

- id: 12
  phrase: "Cuando es san patricio?"
  mode: none
  expected: []
  validates: "Conocimiento general sin tools"

- id: 13
  phrase: "gracias crack"
  mode: none
  expected: []
  validates: "Charla pura, cero tools"

- id: 14
  phrase: "que hora es"
  mode: none
  expected: []
  validates: "El bug histórico: sin fecha/hora en el prompt esto degeneraba en \"Son las 00:00 horas, señor\". Ahora el planner ya recibe la fecha de hoy — validar que responde sin tools (la hora exacta la resuelve Alfred con el datetime del synthesis prompt, no con una tool)"

- id: 15
  phrase: "que tareas tengo abiertas en saxhero"
  mode: exact
  expected: [tasks_list]
  validates: "Sprint 2: tasks_list filtrado por proyecto, estado abierto por defecto"

- id: 16
  phrase: "apuntame una tarea en sebastian: revisar fuzzy match"
  mode: exact
  expected: [tasks_create]
  validates: "Sprint 2: tasks_create. 'sebastian' debe validar contra PROJECTS.md (sección 'Sebastian 2.0 — ...') vía known_projects"

- id: 17
  phrase: "en que estado esta el proyecto agora?"
  mode: exact
  expected: [consult_docs]
  validates: "Sprint 2: consult_docs resolviendo la sección '## agora' de PROJECTS.md"

- id: 18
  phrase: "que puerto usa glasspannel?"
  mode: exact
  expected: [consult_docs]
  validates: "Sprint 2: consult_docs — la sección de glasspannel no dice \"puerto\" literal (dice URL http://seb01:3000), valida que el planner llama a la tool igualmente y deja que Alfred infiera del contenido devuelto"

- id: 19
  phrase: "marca como hecha la tarea 9001"
  mode: exact
  expected: [tasks_complete]
  validates: "Sprint 2: tasks_complete con id sembrado explícito (fixture golden #19, project 'saxhero')"

- id: 20
  phrase: "recuerda que mi cuñado Paco es alérgico a los frutos secos"
  mode: exact
  expected: [mark_as_memorable]
  validates: "Sprint 3: mark_as_memorable — hecho personal duradero, escribe un punto real en sebastian_memory_test"

- id: 21
  phrase: "que te dije de la alergia de paco?"
  mode: exact
  expected: [search_memory]
  validates: "Sprint 3: search_memory encuentra la memoria sembrada en conftest.py (misma frase que golden #20, contenido pre-existente vía fixture)"

- id: 22
  phrase: "apunta leche a la compra"
  mode: exact
  expected: [list_add_item]
  validates: "Sprint 3: frontera operativo vs memoria — 'apunta' aquí es la lista de la compra, NO debe disparar mark_as_memorable"
