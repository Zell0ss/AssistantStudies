# Sprite Expression Mapping
# Maps expression names to sprite image files (within each skin directory)

# Skin directory structure: images/{skin_name}/{expression_files}
# Each skin must have all 12 expressions with these filenames

expressions:
  neutral: 000_neutral.webp
  thinking: 001_thinking.webp
  confident: 002_confident.webp
  surprised: 003_surprised.webp
  concerned: 004_concerned.webp
  triumphant: 005_triumphant.webp
  confused: 006_confused.webp
  serious: 007_serious.webp
  skeptical: 008_skeptical.webp
  apologetic: 009_apologetic.webp
  excited: 010_excited.webp
  deadpan: 011_deadpan.webp

# Default expression when requested expression is not found
default: neutral

# Default skin
default_skin: sebastian

# Available skins (add new skins here as you create them)
available_skins:
  - sebastian
  # - cute
  # - serious
  # Add more skins here...
